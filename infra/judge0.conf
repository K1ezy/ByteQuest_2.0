# Judge0 CE Configuration File
# Note: Host must be configured with systemd.unified_cgroup_hierarchy=0 (cgroup v1)

# Worker configuration
MAINTENANCE_MODE=false
REDIS_HOST=judge0-redis
REDIS_PORT=6379
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_secure_db_pass

# Resource limits
CPU_TIME_LIMIT=2.0
CPU_EXTRA_TIME=0.5
WALL_TIME_LIMIT=5.0
MEMORY_LIMIT=128000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=1024

# Security and Sandbox
ENABLE_ISOLATE=true
NUMBER_OF_RUNS=1
