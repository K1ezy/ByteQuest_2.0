# Judge0 CE Configuration for ByteQuest 2.0 (4GB RAM VPS Profile)

# Internal Docker Service Discovery Hostnames
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=bytequest_redis_secret

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=bytequest_pg_secret

# Worker Concurrency (2 workers prevent CPU thrashing on a 2-vCPU VPS)
COUNT=2

# Sandbox Execution & Resource Limits (Tuned for C++, Python, and Java JVM)
MAX_QUEUE_SIZE=100
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20

# Memory Limits (Java OpenJDK requires >= 128MB virtual address space to compile)
MEMORY_LIMIT=256000
MAX_MEMORY_LIMIT=512000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60

# Security & Sandbox Restrictions
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
ENABLE_COMPILER_OPTIONS=true
ENABLE_COMMAND_LINE_ARGUMENTS=false
ENABLE_SUBMISSION_DELETE=false
ENABLE_WAIT_RESULT=true
