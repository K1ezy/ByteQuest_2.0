# Later Linux VPS deployment template. Local development uses Supabase CLI plus
# the private Ubuntu Judge0 VM configured by configure-judge0-vm.ps1.
# This file's Judge0 image is standard CE, not the VM's Extra CE release.
x-judge0-logging: &default-logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  # ==========================================================================
  # 1. Caddy API Gateway (Automatic HTTPS Reverse Proxy)
  # ==========================================================================
  caddy:
    profiles: ["vps"]
    image: caddy:2.8-alpine
    container_name: bytequest-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fastapi
    networks:
      - bytequest_net
    logging: *default-logging

  # ==========================================================================
  # 2. FastAPI Backend Service
  # ==========================================================================
  fastapi:
    profiles: ["vps"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bytequest-fastapi
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      - JUDGE0_BASE_URL=http://judge0-server:2358
      - ML_ARTIFACTS_DIR=/app/ml_artifacts
    volumes:
      - ../ml_pipeline/artifacts:/app/ml_artifacts:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - judge0-server
    networks:
      - bytequest_net
    logging: *default-logging

  # ==========================================================================
  # 3. Judge0 CE Server (Isolated Code Execution API - Rule 3)
  # ==========================================================================
  judge0-server:
    profiles: ["vps"]
    image: judge0/judge0:1.13.1
    container_name: judge0-server
    restart: unless-stopped
    # Bind ONLY to 127.0.0.1 so Judge0 is never exposed to the public internet
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    env_file:
      - ./judge0.conf
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0-db
      - judge0-redis
    networks:
      - bytequest_net
    logging: *default-logging

  # ==========================================================================
  # 4. Judge0 CE Background Workers (Resque Compilation Queue)
  # ==========================================================================
  judge0-workers:
    profiles: ["vps"]
    image: judge0/judge0:1.13.1
    container_name: judge0-workers
    command: ["./scripts/workers"]
    restart: unless-stopped
    privileged: true
    env_file:
      - ./judge0.conf
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0-db
      - judge0-redis
    networks:
      - bytequest_net
    logging: *default-logging

  # ==========================================================================
  # 5. Judge0 Internal PostgreSQL (Sandbox Metadata Only)
  # ==========================================================================
  judge0-db:
    profiles: ["vps"]
    image: postgres:16-alpine
    container_name: judge0-db
    restart: unless-stopped
    env_file:
      - ./judge0.conf
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    networks:
      - bytequest_net
    logging: *default-logging

  # ==========================================================================
  # 6. Judge0 Internal Redis (Message Queue for Code Submissions)
  # ==========================================================================
  judge0-redis:
    profiles: ["vps"]
    image: redis:7-alpine
    container_name: judge0-redis
    restart: unless-stopped
    command:
      - bash
      - -c
      - docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"
    env_file:
      - ./judge0.conf
    networks:
      - bytequest_net
    logging: *default-logging

networks:
  bytequest_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  judge0_postgres_data:
