name: Regression

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      BYTEQUEST_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_JWT_SECRET: bytequest-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: supabase/setup-cli@v3
        with:
          version: 2.101.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Install backend test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: backend
      - name: Run unit and learning-flow regression tests
        run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
