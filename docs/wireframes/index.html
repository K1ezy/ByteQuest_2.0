<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ByteQuest — Web App Wireframes</title>
  <style>
    :root{font:15px/1.45 system-ui,Arial,sans-serif;color:#202020;background:#e8e8e8}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #333;outline-offset:2px}.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:#f8f8f8;border-right:1px solid #bbb;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.sidebar h1{font-size:1.35rem;margin:0 0 6px}.sidebar p{color:#555;margin:0 0 18px}.nav{display:grid;gap:5px}.nav button{text-align:left;border:1px solid transparent;background:none;padding:8px 10px;border-radius:5px}.nav button:hover,.nav button[aria-current=page]{background:#ddd;border-color:#999}.nav small{display:block;color:#666}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1180px;margin:24px auto 12px;padding:0 20px}.toolbar h2{margin:0;font-size:1.2rem}.toolbar p{margin:2px 0 0;color:#555}.toolbar .controls{display:flex;gap:6px}.toolbar button,.action{border:1px solid #333;background:white;border-radius:4px;padding:7px 11px}.toolbar button[aria-pressed=true],.action.primary{background:#333;color:white}.stage{padding:0 20px 40px}.frame{background:#fff;border:1px solid #888;box-shadow:0 8px 22px #0002;max-width:1140px;min-height:670px;margin:auto;transition:max-width .2s}.frame.phone{max-width:390px;min-height:750px}.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 24px;border-bottom:2px solid #555}.brand{font-weight:800;letter-spacing:.02em}.appbar nav{display:flex;flex-wrap:wrap;gap:6px}.appbar button{background:none;border:0;text-decoration:underline;padding:5px}.content{padding:26px}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:#666}.hero{border:2px solid #555;background:#f4f4f4;padding:30px;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center}.hero h1,.content h1{font-size:2rem;line-height:1.15;margin:8px 0 12px}.hero p{max-width:56ch}.placeholder{border:2px dashed #999;background:repeating-linear-gradient(135deg,#f3f3f3,#f3f3f3 12px,#e6e6e6 12px,#e6e6e6 24px);min-height:160px;display:grid;place-items:center;color:#555;text-align:center}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card,.panel{border:1px solid #888;padding:18px;background:#fff}.card h3,.panel h3{margin:0 0 9px}.card p,.panel p{margin:7px 0}.muted{color:#666}.chip{display:inline-block;border:1px solid #888;border-radius:20px;padding:2px 8px;font-size:.8rem;margin:2px 4px 2px 0}.line{border-top:1px solid #bbb;margin:15px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #ddd;padding:12px 0}.row:last-child{border:0}.field{display:grid;gap:5px;margin:12px 0;max-width:460px}.field span{font-weight:600}.input{border:1px solid #777;background:#fafafa;padding:11px;min-height:42px;color:#777}.stack{max-width:600px;margin:auto}.split{display:grid;grid-template-columns:2fr 1fr;gap:18px}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:15px 0}.tabs span{border:1px solid #888;padding:6px 10px}.tabs .selected{background:#333;color:white}.progress{height:15px;border:1px solid #777;background:#eee}.progress i{display:block;height:100%;background:#777}.note{border-left:4px solid #777;background:#f2f2f2;padding:11px;margin:14px 0}.danger{border-left-color:#333}.meta{max-width:1140px;margin:0 auto 12px;color:#444;display:flex;gap:12px;flex-wrap:wrap}.meta span{background:#ddd;padding:4px 8px}.footer{font-size:.85rem;color:#666;border-top:1px solid #bbb;padding-top:18px;margin-top:30px}.phone .appbar{padding:12px}.phone .appbar nav{display:none}.phone .appbar:after{content:'☰ Menu';font-size:.8rem}.phone .content{padding:18px}.phone .hero,.phone .split,.phone .grid,.phone .grid.two{grid-template-columns:1fr}.phone .hero{padding:18px}.phone .row{align-items:flex-start;flex-direction:column}@media(max-width:800px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid #bbb}.nav{grid-template-columns:repeat(2,1fr)}.toolbar{margin-top:15px}.frame{min-height:600px}}@media(max-width:500px){.nav{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.grid,.grid.two,.split,.hero{grid-template-columns:1fr}.content{padding:18px}}
  </style>
</head>
<body>
<div class="shell"><aside class="sidebar"><h1>ByteQuest wireframes</h1><p>Whole app · student and instructor</p><div class="nav" id="nav"></div></aside><main><div class="toolbar"><div><h2 id="screen-title"></h2><p id="screen-subtitle"></p></div><div class="controls"><button id="desktop" aria-pressed="true">Desktop</button><button id="phone" aria-pressed="false">Phone</button></div></div><div class="meta" id="meta"></div><div class="stage"><div class="frame" id="frame"><header class="appbar"><div class="brand">◼ BYTEQUEST</div><nav><button data-go="home">Home</button><button data-go="quests">Quests</button><button data-go="leaderboard">Leaderboard</button><button data-go="studio">Instructor</button><button data-go="signin">Account</button></nav></header><div class="content" id="content"></div></div></div></main></div>
<script>
const B=(label,to,primary=false)=>`<button class="action ${primary?'primary':''}" data-go="${to}">${label}</button>`;
const H=(title,lead)=>`<div class="eyebrow">ByteQuest learning journey</div><h1>${title}</h1><p class="muted">${lead}</p>`;
const C=(title,body,actions='')=>`<section class="card"><h3>${title}</h3><p>${body}</p><div class="actions">${actions}</div></section>`;
const F=(label,hint)=>`<label class="field"><span>${label}</span><div class="input">${hint}</div></label>`;
const N=(text)=>`<div class="note">${text}</div>`;
const R=(left,right)=>`<div class="row"><span>${left}</span><span>${right}</span></div>`;
const screens={
home:{group:'Entry',title:'Home',route:'/',status:'Current',lead:'Discover the learning journey and choose a starting action.',html:()=>`<div class="hero"><div><div class="eyebrow">Learn by doing</div><h1>Start your coding quest</h1><p>Build skills through guided lessons, quizzes, code challenges, and visible progress.</p><div class="actions">${B('Explore quests','quests',true)}${B('Sign in','signin')}</div></div><div class="placeholder">Hero illustration / learner journey</div></div><div class="grid">${C('Choose a track','Pick a path that matches your level.',B('Select track','track'))}${C('Practice concepts','Short quizzes check understanding.',B('View quiz flow','quiz'))}${C('Solve problems','Code challenges return actionable feedback.',B('View arena','arena'))}</div>`},
signin:{group:'Entry',title:'Sign in',route:'/onboarding',status:'Current',lead:'Enter an existing account and resume progress.',html:()=>`<div class="stack">${H('Welcome back','Sign in to continue your ByteQuest journey.')}${F('Email','name@example.com')}${F('Password','••••••••')}<div class="actions">${B('Sign in','quests',true)}${B('Forgot password?','reset')}${B('Create account','signup')}</div>${N('States: invalid credentials, loading, email confirmation, and successful sign in.')}</div>`},
signup:{group:'Entry',title:'Create account',route:'/onboarding',status:'Current',lead:'Create a learner identity and begin onboarding.',html:()=>`<div class="stack">${H('Create your account','A short setup before the first quest.')}${F('Display name','Your name')}${F('Email','name@example.com')}${F('Password','Choose a password')}<div class="actions">${B('Create account','track',true)}${B('Already have an account?','signin')}</div>${N('States: field validation, existing email, confirmation sent, and success.')}</div>`},
reset:{group:'Entry',title:'Reset password',route:'/onboarding',status:'Current',lead:'Recover account access.',html:()=>`<div class="stack">${H('Reset your password','Enter the email linked to your account.')}${F('Email','name@example.com')}<div class="actions">${B('Send reset link','signin',true)}${B('Back to sign in','signin')}</div>${N('Show a neutral confirmation even when an address is unknown.')}</div>`},
track:{group:'Entry',title:'Choose track',route:'/onboarding',status:'Current',lead:'Select or change the learning track.',html:()=>`${H('Choose your path','You can change tracks later from the journey menu.')}<div class="grid">${C('Beginner','Start with fundamentals and guided practice.',B('Choose Beginner','quests',true))}${C('Intermediate','Build on core syntax and problem solving.',B('Choose Intermediate','quests'))}${C('Advanced','Take on more independent challenges.',B('Choose Advanced','quests'))}</div>${N('Selection state: active card, save progress, loading, and retry on failure.')}`},
quests:{group:'Student',title:'Quest map',route:'/quests',status:'Current',lead:'Browse and resume lessons, quizzes, and code challenges.',html:()=>`${H('Your quest map','Find a quest group and continue where you left off.')}<div class="tabs"><span class="selected">All quests</span><span>In progress</span><span>Completed</span></div><div class="split"><div><div class="grid two">${C('Python foundations','3 quests · beginner · 40% complete',B('Open group','group',true))}${C('Web fundamentals','4 quests · beginner · Not started',B('Open group','group'))}${C('Problem solving','5 quests · intermediate · Locked',B('View requirements','group'))}</div></div><aside class="panel"><h3>Journey summary</h3><p>Level 3 · 240 XP</p><div class="progress"><i style="width:60%"></i></div><div class="actions">${B('View progress','progress')}${B('Leaderboard','leaderboard')}</div></aside></div>${N('States: loading, no quests, locked group, failed fetch, and completed group.')}`},
group:{group:'Student',title:'Quest group',route:'/quests',status:'Current',lead:'See group overview, progress, and available activities.',html:()=>`${H('Python foundations','Learn syntax, decisions, and loops through a sequence of short activities.')}<div class="actions">${B('Join group','join',true)}${B('Back to map','quests')}</div><div class="split"><div class="panel"><h3>Quest sequence</h3>${R('1. Variables and values',B('Start quiz','quiz'))}${R('2. Conditions',B('Open quiz','quiz'))}${R('3. Loops',B('Open arena','arena'))}${R('4. Final challenge','Locked until previous activity')}</div><aside class="panel"><h3>Your progress</h3><p>2 of 4 steps complete</p><div class="progress"><i style="width:50%"></i></div><p class="muted">Rewards: XP and badge at completion.</p></aside></div>`},
join:{group:'Student',title:'Join group',route:'/quests',status:'Current',lead:'Confirm membership in a quest group.',html:()=>`<div class="stack">${H('Join Python foundations','Group membership lets your progress appear within this quest group.')}<div class="panel"><h3>Group details</h3>${R('Track','Beginner')}${R('Activities','4')}${R('Instructor','Course instructor')}</div><div class="actions">${B('Join group','group',true)}${B('Cancel','quests')}</div>${N('States: already joined, group unavailable, request failed, and success.')}</div>`},
create:{group:'Instructor',title:'Create group',route:'/quests',status:'Current · instructor only',lead:'Instructor controls for creating a quest group.',html:()=>`<div class="stack">${H('Create quest group','Organize activities for a cohort.')}${F('Group title','e.g. Python foundations')}${F('Description','What learners will practice')}${F('Track','Choose a track')}${F('Activities','Choose published activities')}<div class="actions">${B('Create group','group',true)}${B('Cancel','quests')}</div>${N('Permission: only instructors can save. Student previews should explain the restriction.')}</div>`},
quiz:{group:'Learning',title:'Quiz question',route:'/quiz/[id]',status:'Current',lead:'Answer one concept question at a time.',html:()=>`${H('Concept check','Question 2 of 5 · Python foundations')}<div class="progress"><i style="width:40%"></i></div><div class="panel" style="margin-top:18px"><h3>What value does this expression produce?</h3><div class="placeholder" style="min-height:75px">Code or question media</div>${['A. One possible answer','B. Another possible answer','C. A third possible answer','D. A fourth possible answer'].map(x=>`<div class="row"><label><input type="radio" name="answer"> ${x}</label></div>`).join('')}</div><div class="actions">${B('Submit answer','quizreview',true)}${B('Exit quiz','group')}</div>${N('States: unanswered validation, autosave or retry, keyboard choice selection, and submission progress.')}`},
quizreview:{group:'Learning',title:'Quiz feedback',route:'/quiz/[id]',status:'Current',lead:'Understand the answer before continuing.',html:()=>`${H('Answer review','Question 2 of 5')}<div class="panel"><h3>Your answer</h3><p>B. Another possible answer</p><div class="note"><strong>Explanation</strong><p>Feedback explains the concept and how to reason about it.</p></div></div><div class="actions">${B('Next question','quiz',true)}${B('See results','quizresult')}</div>${N('Correct answer is revealed only after submission; never expose future answers.')}`},
quizresult:{group:'Learning',title:'Quiz result',route:'/quiz/[id]',status:'Current',lead:'Review score and choose the next activity.',html:()=>`${H('Quiz complete','You answered 4 of 5 questions correctly.')}<div class="grid two">${C('Your score','80% · +40 XP',B('Review answers','quizreview'))}${C('Next step','Try the related code challenge.',B('Start arena','arena',true))}</div><div class="actions">${B('Back to group','group')}${B('View progress','progress')}</div>`},
arena:{group:'Learning',title:'Code arena',route:'/arena/[id]',status:'Current',lead:'Read the problem, write code, run samples, and submit.',html:()=>`${H('Code challenge: Count values','Write a solution in the selected language.')}<div class="split"><div><div class="panel"><h3>Problem</h3><p>Given input values, compute the requested result.</p><h3>Examples</h3>${R('Input','Sample input')}${R('Output','Expected output')}<p class="muted">Constraints and hints below the examples.</p></div><div class="panel" style="margin-top:14px"><h3>Editor</h3><div class="placeholder" style="min-height:200px">Code editor · language selector · line numbers</div><div class="actions">${B('Run sample','arena')}${B('Submit solution','arenaresult',true)}</div></div></div><aside class="panel"><h3>Run output</h3><p>Sample result, stderr, and execution status appear here.</p><div class="line"></div><p class="muted">Official hidden cases run only on submission.</p></aside></div>${N('States: compiling, running, timeout, runtime error, submission queued, and service unavailable.')}`},
arenaresult:{group:'Learning',title:'Arena result',route:'/arena/[id]',status:'Current',lead:'Understand grading and decide whether to retry.',html:()=>`${H('Submission result','Your solution passed 7 of 8 tests.')}<div class="grid two">${C('Outcome','Partial pass · 87.5% · XP awarded according to score.',B('Try again','arena',true))}${C('Feedback','One edge case failed. Review constraints and input handling.',B('View quest group','group'))}</div>${N('Show only public diagnostics. Hidden test inputs and expected outputs remain private.')}`},
progress:{group:'Student',title:'Journey and progress',route:'Shared header / /quests',status:'Current',lead:'Track XP, badges, recent activity, and selected track.',html:()=>`${H('Your journey','A compact drawer or page summary from the header.')}<div class="grid">${C('Level and XP','Level 3 · 240 XP · next level at 300 XP')}${C('Badges','First quiz · Code challenger')}${C('Current track','Beginner',B('Change track','track'))}</div><div class="panel"><h3>Recent activity</h3>${R('Python foundations quiz','Completed · 40 XP')}${R('Count values challenge','Partial pass · 25 XP')}${R('Next recommendation',B('Continue quest','group'))}</div>`},
leaderboard:{group:'Student',title:'Leaderboard',route:'/quests?view=leaderboard',status:'Current',lead:'Compare progress within the allowed scope.',html:()=>`${H('Leaderboard','Rankings for the current quest context.')}<div class="tabs"><span class="selected">This group</span><span>All learners</span></div><div class="panel"><h3>Rankings</h3>${R('#1 · Learner A','680 XP')}${R('#2 · Learner B','560 XP')}${R('#3 · You','490 XP')}${R('#4 · Learner D','410 XP')}</div>${N('States: no rankings yet, loading, privacy-limited display, and failed fetch.')}`},
studio:{group:'Instructor',title:'Instructor studio',route:'/instructor',status:'Current',lead:'Manage content from source material to published activities.',html:()=>`${H('Instructor studio','Prepare documents, generate activities, review them, and monitor outcomes.')}<div class="grid">${C('Documents','Upload and manage learning material.',B('Open documents','documents',true))}${C('Generate challenge','Create a code problem from approved material.',B('Start generation','challenge'))}${C('Generate quiz','Create concept questions for review.',B('Start generation','quizgen'))}</div><div class="grid two">${C('Review queue','Inspect drafts and publish approved content.',B('Review drafts','review'))}${C('Analytics','Aggregate learner activity and shadow scoring.',B('View analytics','analytics'))}</div>${N('Permission: instructor role required. Show an access explanation for other accounts.')}`},
documents:{group:'Instructor',title:'Documents',route:'/instructor',status:'Current',lead:'Upload, inspect, and manage source document versions.',html:()=>`${H('Source documents','Maintain the material used to generate lessons and challenges.')}<div class="panel"><h3>Upload material</h3><div class="placeholder" style="min-height:95px">Drop file or choose file</div>${F('Title','Document title')}<div class="actions">${B('Upload document','documents',true)}</div></div><div class="panel" style="margin-top:16px"><h3>Document library</h3>${R('Python basics · v2 · Ready',B('Use for challenge','challenge'))}${R('Loops lesson · v1 · Processing','Wait for indexing')}${R('Archived notes · v1 · Archived','Read only')}</div>${N('States: file validation, uploading, processing, failed indexing, ready, and archived.')}`},
challenge:{group:'Instructor',title:'Generate challenge',route:'/instructor',status:'Current',lead:'Choose source and constraints, then inspect the draft.',html:()=>`<div class="stack">${H('Generate code challenge','Use a ready source document and a clear learning objective.')}${F('Source document','Python basics · v2')}${F('Learning objective','Practice conditions and loops')}${F('Difficulty','Beginner / Intermediate / Advanced')}${F('Language','Python')}<div class="actions">${B('Generate draft','review',true)}${B('Back to studio','studio')}</div>${N('States: generation queued, failure, insufficient source material, and draft ready.')}</div>`},
quizgen:{group:'Instructor',title:'Generate quiz',route:'/instructor',status:'Current',lead:'Specify topic and question count before review.',html:()=>`<div class="stack">${H('Generate concept quiz','Create questions grounded in a source document.')}${F('Source document','Python basics · v2')}${F('Topic','Variables and values')}${F('Question count','5')}${F('Difficulty','Beginner')}<div class="actions">${B('Generate draft','review',true)}${B('Back to studio','studio')}</div>${N('States: generation queued, failure, draft ready, and validation errors.')}</div>`},
review:{group:'Instructor',title:'Review and publish',route:'/instructor',status:'Current',lead:'Validate the draft and publish when ready.',html:()=>`${H('Review draft','Inspect learner-facing content, answers, and grading rules.')}<div class="split"><div class="panel"><h3>Draft content</h3>${F('Title','Generated activity title')}${F('Instructions','Editable problem statement or question')}${F('Answer / solution','Instructor only')}${F('Tests / options','Review every case or option')}<div class="actions">${B('Save draft','review')}${B('Publish','studio',true)}</div></div><aside class="panel"><h3>Pre-publish check</h3><p>□ Source is current</p><p>□ Wording is clear</p><p>□ Answer is correct</p><p>□ Hidden cases are valid</p><p>□ Difficulty is appropriate</p></aside></div>${N('States: validation failure, unsaved changes, publish success, and version conflict.')}`},
analytics:{group:'Instructor',title:'Analytics',route:'/instructor',status:'Current',lead:'Inspect aggregate learning signals and shadow scoring.',html:()=>`${H('Learning analytics','Course level activity and outcomes.')}<div class="grid">${C('Participation','Learners active this week · 42')}${C('Completion','Quest completion rate · 64%')}${C('Challenge outcomes','Pass rate · 72%')}</div><div class="panel"><h3>Shadow scoring</h3><div class="placeholder" style="min-height:180px">Aggregate chart / cohort trend</div><p class="muted">Experimental scoring is disabled for learner decisions.</p></div>${N('Individual research consent is not yet implemented. Do not present participant-level research views as current.')}`},
consent:{group:'Planned',title:'Research consent',route:'No route yet',status:'Planned',lead:'Proposed gate before individual research data use.',html:()=>`<div class="stack">${H('Research participation','Explain what data is used, why, and how a learner can opt out.')}${C('What is collected','Relevant learning activity and outcome data, described in plain language.')}${C('Your choice','Participation is voluntary. Learning access continues if you decline.')}${C('Your controls','View consent status and withdraw later.') }<div class="actions">${B('I agree','progress',true)}${B('No thanks','progress')}</div>${N('Planned only. Needs policy, retention, withdrawal, and backend enforcement before implementation.')}</div>`}
};
const keys=Object.keys(screens),nav=document.getElementById('nav'),frame=document.getElementById('frame');
let width='desktop';
function render(){const key=decodeURIComponent(location.hash.slice(1))||'home';const s=screens[key]||screens.home;nav.innerHTML=keys.map(k=>`<button data-go="${k}" ${k===key?'aria-current="page"':''}>${screens[k].title}<small>${screens[k].group}</small></button>`).join('');document.getElementById('screen-title').textContent=s.title;document.getElementById('screen-subtitle').textContent=s.lead;document.getElementById('meta').innerHTML=`<span>Route: ${s.route}</span><span>Status: ${s.status}</span><span>Primary user: ${s.group}</span>`;document.getElementById('content').innerHTML=s.html()+`<div class="footer">Wireframe for flow review · grayscale structure and representative content · not production UI</div>`;frame.classList.toggle('phone',width==='phone');document.getElementById('desktop').setAttribute('aria-pressed',width==='desktop');document.getElementById('phone').setAttribute('aria-pressed',width==='phone');}
document.addEventListener('click',e=>{const target=e.target.closest('[data-go]');if(target){location.hash=target.dataset.go;render()}});document.getElementById('desktop').onclick=()=>{width='desktop';render()};document.getElementById('phone').onclick=()=>{width='phone';render()};window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
