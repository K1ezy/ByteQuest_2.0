<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ByteQuest pilot flows</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8ebe8;color:#1c2922;font:16px/1.5 system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #245e42;outline-offset:3px}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.nav{background:#fff;padding:22px;border-right:1px solid #aeb9b0}.nav h1{font-size:1.2rem;margin:0 0 8px}.nav p{font-size:.85rem;color:#506257}.nav button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:10px}.nav button[aria-current=true]{background:#dcece0;font-weight:700}.main{padding:24px}.toolbar{display:flex;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto 12px}.toolbar h2{margin:0}.toolbar p{margin:0;color:#52635a}.toolbar button,.btn{border:1px solid #254b34;background:#fff;padding:9px 13px;border-radius:5px}.btn.primary{background:#245e42;color:#fff}.device{max-width:1120px;min-height:700px;margin:auto;background:#fff;border:1px solid #7d9884;box-shadow:0 12px 32px #152b1a20}.device.phone{max-width:390px}.appbar{display:flex;align-items:center;justify-content:space-between;padding:15px 24px;border-bottom:1px solid #b9c8bc}.appbar nav{display:flex;gap:18px}.appbar a{color:#1c2922}.content{padding:28px}.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:#53765d}h1{font-size:2rem;line-height:1.2;margin:8px 0}h3{margin:0 0 8px}.lead{color:#52635a;margin:0 0 20px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{border:1px solid #9fb1a3;border-radius:7px;padding:18px;margin:0 0 14px;background:#fff}.card.emphasis{border:2px solid #285c3b;background:#f0f7f1}.card p{margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.chip{border:1px solid #9fb1a3;border-radius:30px;padding:3px 9px;font-size:.8rem;display:inline-block}.bar{height:11px;background:#e2e9e3;border:1px solid #9fb1a3}.bar span{display:block;height:100%;background:#4b8b60}.row{border-bottom:1px solid #dde6de;padding:11px 0;display:flex;justify-content:space-between;gap:10px}.row:last-child{border:0}.field{display:block;margin:10px 0;font-weight:600}.field span{display:block;border:1px solid #9fb1a3;padding:10px;color:#627468;font-weight:400;margin-top:5px}.state{border-left:4px solid #628a6c;background:#f2f6f2;padding:12px;margin:16px 0}.state strong{display:block}.mono{font:14px/1.5 ui-monospace,monospace;background:#17271e;color:#e5f0e7;padding:18px;min-height:180px}.foot{font-size:.8rem;color:#56685a;margin-top:24px;border-top:1px solid #ccd7cf;padding-top:12px}.phone .appbar nav{display:none}.phone .appbar:after{content:'Menu ☰'}.phone .content{padding:18px}.phone .grid,.phone .cards{grid-template-columns:1fr}.phone .row{flex-direction:column}@media(max-width:700px){.shell{display:block}.nav{border:0;border-bottom:1px solid #aeb9b0}.nav .links{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:12px}.grid,.cards{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside class="nav"><h1>ByteQuest pilot</h1><p>Revised flows · desktop and phone</p><div class="links" id="links"></div></aside><main class="main"><div class="toolbar"><div><h2 id="title"></h2><p id="description"></p></div><div><button id="desktop">Desktop</button> <button id="phone">Phone</button></div></div><div class="device" id="device"><header class="appbar"><strong>◼ BYTEQUEST</strong><nav><a href="#dashboard">Dashboard</a><a href="#quests">Quest map</a><a href="#exams">Exams</a><a href="#instructor">Instructor</a></nav></header><div class="content" id="content"></div></div></main></div><script>
const go=(label,id,primary=false)=>`<button class="btn ${primary?'primary':''}" data-go="${id}">${label}</button>`;
const card=(title,body,actions='',emphasis=false)=>`<section class="card ${emphasis?'emphasis':''}"><h3>${title}</h3><p>${body}</p><div class="actions">${actions}</div></section>`;
const state=(label,text)=>`<div class="state"><strong>${label}</strong>${text}</div>`;
const pages={
dashboard:['Resume dashboard','Signed-in student landing · exam deadline first',`<div class="eyebrow">Welcome back</div><h1>Pick up where you left off</h1><p class="lead">One clear next step, with the whole quest map nearby.</p><div class="grid"><div>${card('Exam due today','Python foundations · opens 9:00 AM · closes 10:30 AM · Asia/Manila',go('Open exam','exam'),true)}${card('Continue learning','Loops: code challenge · your draft is saved to your account.',go('Continue challenge','arena',true)+go('Full quest map','quests'))}</div><aside>${card('Mastery','Conditions: confident · Loops: keep practicing<br><div class="bar"><span style="width:60%"></span></div>')}${card('Rewards','Level 3 · 240 XP · 2 badges')}</aside></div>${state('Loading / empty','Show a skeleton or a first-quest invitation. Never show a stale deadline as current.')}`],
quests:['Quest map','Student discovery and recommended next activity',`<div class="eyebrow">Your track</div><h1>Quest map</h1><p class="lead">Continue the recommended activity or browse your group.</p><div class="grid"><div>${card('Recommended next · Loops','Code challenge · 40% complete · Python foundations',go('Continue','arena',true),true)}<div class="cards">${card('Variables','Quiz · complete',go('Review','quiz'))}${card('Conditions','Quiz · complete',go('Review','quiz'))}${card('Loops','Code · in progress',go('Open','arena'))}${card('Functions','Locked · finish Loops first')}</div></div><aside>${card('Python foundations','2 of 4 activities complete · instructor group',go('Group details','group'))}${card('Join a group','Enter an instructor invite code.',go('Join','join'))}</aside></div>${state('Error / reconnect','Keep visible quest context and offer Retry when data cannot refresh.')}`],
arena:['Code arena','Practice task, synced draft, limited hints, persistent grading',`<div class="eyebrow">Practice · challenge</div><h1>Count matching values</h1><p class="lead">Your draft is saved to your account. Sample runs do not create graded attempts.</p><div class="grid"><div>${card('Problem','Read constraints and visible examples before coding.') }<div class="mono"># Your solution<br>def solve(values):<br>&nbsp;&nbsp;&nbsp;&nbsp;pass</div><div class="actions">${go('Run sample','arena')}${go('Submit solution','pending',true)}</div></div><aside>${card('Hints · 3 of 5 left','Instructor hints are available now. AI guidance unlocks after a failed run.',go('Reveal reviewed hint','arena')+go('Request AI hint','arena'))}${card('Output','Visible sample result or compiler diagnostics. Hidden tests remain private.')}</aside></div>${state('Offline / draft','Keep editing, mark unsynced changes, and retry save. Do not claim a draft is saved until the API confirms it.')}`],
pending:['Submission pending','Recoverable grading after navigation or Wi-Fi loss',`<h1>We received your submission</h1><p class="lead">Submission #3 is queued. You can leave this page and return to the result.</p>${card('Status · grading','Keep the job ID and poll with backoff; show queued, running, completed, or failed.',go('Return to dashboard','dashboard')+go('Check result','result',true),true)}${state('Reconnect','Restore the same job by ID. Repeated taps with the same idempotency key cannot create duplicate attempts.')}`],
result:['Practice result','Actionable feedback and next activity',`<div class="eyebrow">Submission #3</div><h1>7 of 8 tests passed</h1><p class="lead">One edge case still needs work. Your XP is awarded only once after first success.</p><div class="grid"><div>${card('Visible diagnostics','Show public case input, output, and compiler or runtime errors. Never show hidden test data.')}${card('Next step','Review the boundary condition and try again.',go('Edit solution','arena',true)+go('Quest map','quests'))}</div><aside>${card('Hints','2 of 5 used. Revisit revealed hints for free.')}</aside></div>`],
instructor:['Instructor publishing','One visible path from source document to reviewed activity',`<h1>Content studio</h1><p class="lead">Source → Generate → Edit → Verify → Publish</p><div class="cards">${card('1 · Upload document','Versioned PDF · processing status · owner-only access',go('Review source','instructor'))}${card('2 · Generate draft','Challenge or quiz from a ready source.',go('Generate','instructor'))}${card('3 · Review content','Edit wording, answers, tests, and five reviewed hint slots.',go('Review','instructor'))}${card('4 · Verify and publish','Check Judge0 results and publish the reviewed activity.',go('Publish','instructor',true))}</div>${state('Failure','Keep the draft and display the failing step with a retry; never auto-publish AI output.')}`],
exams:['Exam list','Group assignments and release status',`<h1>Exams</h1><p class="lead">Times shown in Asia/Manila.</p>${card('Python foundations exam','Today 9:00–10:30 AM · one attempt · 45 minutes once started',go('Open exam','exam',true),true)}${card('Previous exam','Submitted · results pending instructor release')}${state('Closed / not assigned','Explain why the exam is unavailable without exposing questions.')}`],
exam:['Take exam','Timed mixed quiz and code assessment · no hints',`<div class="eyebrow">Question 2 of 5 · time left 28:14</div><h1>Python foundations exam</h1><p class="lead">Answers are saved to your account. The server timer continues if you disconnect.</p><div class="grid"><div>${card('Question navigator','1 Answered · 2 Current · 3 Unanswered · 4 Code · 5 Code')}${card('Question 2','Choose one answer. You may return and edit before the deadline.',go('Previous','exam')+go('Next','exam',true))}${card('Coding section','Visible sample runs are allowed; hints and hidden-test feedback are not.',go('Run sample','exam'))}</div><aside>${card('Exam rules','One attempt. Auto-submit latest saved work at expiry.',go('Submit exam','examresults',true))}</aside></div>${state('Wi-Fi loss','Show last confirmed save time. Restore the same attempt after sign-in; never pause the timer.')}`],
examresults:['Exam submitted','Results held until instructor release',`<h1>Exam submitted</h1><p class="lead">Your work was received. Your instructor will release scores and solutions later.</p>${card('Status','Submitted · results not released',go('Dashboard','dashboard',true))}${state('Retake','If an instructor grants a retake, retain the previous attempt and label the latest official grade.')}`],
consent:['Research consent','Separate from classroom learning',`<h1>Research participation</h1><p class="lead">The institution-approved text and version will appear here when available.</p>${card('Your choice','Research participation is optional. Declining does not affect learning access.')}${card('After opting in','A student can withdraw in account settings; future research use stops.')}${state('Release gate','This flow stays disabled until approved wording and data policy are supplied. Shadow scoring and exports remain off.')}`],
account:['Account access','Shared-lab session and password recovery',`<h1>Sign in to ByteQuest</h1><label class="field">Email<span>name@example.edu</span></label><label class="field">Password<span>••••••••</span></label><div class="actions">${go('Sign in','dashboard',true)}${go('Reset password','account')}</div>${state('Shared computer','Session lasts until browser close. Sign out remains visible; never leave draft code in local storage.')}${state('Reset','Supabase Auth sends a recovery link through configured institutional SMTP. Show a neutral request confirmation.')}`]
};
let width='desktop';function render(){const id=location.hash.slice(1)||'dashboard';const page=pages[id]||pages.dashboard;document.getElementById('links').innerHTML=Object.keys(pages).map(k=>`<button data-go="${k}" aria-current="${k===id}">${pages[k][0]}</button>`).join('');document.getElementById('title').textContent=page[0];document.getElementById('description').textContent=page[1];document.getElementById('content').innerHTML=page[2]+'<div class="foot">Pilot wireframe · representative content and behavior · implementation specification</div>';document.getElementById('device').classList.toggle('phone',width==='phone')}document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){location.hash=b.dataset.go;render()}});document.getElementById('desktop').onclick=()=>{width='desktop';render()};document.getElementById('phone').onclick=()=>{width='phone';render()};window.addEventListener('hashchange',render);render();
</script></body></html>
